# Пилот: Matrix-сервер Synapse + сервис входа через WhatsApp + nginx + ngrok
services:
  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8008:8008"   # только для команд администратора внутри ВМ

  auth:
    build: ./auth
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data-auth:/data
    depends_on:
      - synapse

  nginx:
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "8080:80"               # для проверки в локальной сети
    depends_on:
      - synapse
      - auth

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: ["http", "--url=${NGROK_DOMAIN}", "nginx:80"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - nginx
