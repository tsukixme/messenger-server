server {
    listen 80;
    client_max_body_size 50M;

    # Админ-API Synapse наружу НЕ открываем
    location /_synapse/admin {
        return 403;
    }

    # Сервис входа через WhatsApp
    location /auth/ {
        proxy_pass http://auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Matrix (Synapse)
    location ~ ^(/_matrix|/_synapse/client) {
        proxy_pass http://synapse:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }

    # Веб-версия Tildes (собранная папка build/web лежит в ./web на ВМ)
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Служебный адрес Matrix: приложения находят сервер по этому ответу.
    # Без него неизвестные адреса отдавали страницу вместо JSON.
    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        return 200 '{"m.homeserver":{"base_url":"https://herbicide-ninth-reliance.ngrok-free.dev"}}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
